plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mineagent" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "shedaniel"
				url = "https://maven.shedaniel.me"
			}
		}
		filter {
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
			includeGroup "dev.architectury"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "BlameJared"
				url = "https://maven.blamejared.com"
			}
		}
		filter {
			includeGroup "mezz.jei"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Content mods loaded only by runClient and the game tests, to check modded workstations, fuels and ids for real.
	localRuntime "maven.modrinth:variant-crafting-tables:8.0"
	// By version id: the NeoForge build shares the version number 26.3-5.3.1.0.
	localRuntime "maven.modrinth:brick-furnace:LnsO9PjF"
	localRuntime "maven.modrinth:cloth-config:26.3.159+fabric"
	localRuntime "maven.modrinth:farmers-delight-refabricated:26.3-3.6.30"

	// Recipe viewer mods MineAgent integrates with when they are installed; compiled against, never bundled.
	clientCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:26.3.824"
	clientCompileOnly "maven.modrinth:architectury-api:22.0.5+fabric"
	clientCompileOnly "mezz.jei:jei-26.3-common-api:31.17.0.108"
	clientCompileOnly "mezz.jei:jei-26.3-fabric-api:31.17.0.108"

	localRuntime "maven.modrinth:rei:26.3.824+fabric"
	localRuntime "maven.modrinth:architectury-api:22.0.5+fabric"
	localRuntime "maven.modrinth:jei:31.17.0.108"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mineagent-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
